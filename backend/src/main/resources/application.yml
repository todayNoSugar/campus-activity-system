server:
  port: 8080
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_activity?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: 【填写本地MySQL账号】
    password: 【填写本地MySQL密码】
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: none

# JWT 配置
jwt:
  # 【重要！部署时请更换为自己的32位以上密钥，不要直接使用示例密钥】
  secret: please-generate-your-own-secret-key-32bit-more
  # 有效期：7 天（毫秒）
  expire: 604800000
